<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <h1 class="game" id="game">Number Guesser</h1>
        <p class="description" id="description">Guesse a number between <span id="min"></span> and <span id="max"></span></p>
        <form>
            <input type="number" name="guess" id="guess" placeholder="Enter your guess...">
            <input type="submit" value="SUBMIT" id="btn">
        </form>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
